name: Unpack project source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand uploaded source archive
        shell: bash
        run: |
          if [ ! -f lh-review-copilot-source.zip ]; then
            echo "Source archive already expanded."
            exit 0
          fi
          mkdir -p .source-unpacked
          unzip -q lh-review-copilot-source.zip -d .source-unpacked || [ $? -eq 1 ]
          chmod -R u+rwX .source-unpacked
          cp -a .source-unpacked/. .
          rm -rf .source-unpacked lh-review-copilot-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand LH Review Copilot source"
          git push
